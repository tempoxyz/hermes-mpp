name: mpp
version: "0.1.3"
description: Transparent MPP payments for Hermes Agent HTTP traffic.
author: Tempo
requires_hermes: ">=0.21.3"
python_dependencies:
  - "httpx>=0.27,<0.29"
  - "pympp[tempo]>=0.11,<0.12"
requires_env:
  - name: TEMPO_PRIVATE_KEY
    prompt: Tempo private key
    help: Use a dedicated, low-balance wallet. Never paste the key into chat.
optional_env:
  - MPP_ALLOWED_ORIGINS
provides_tools:
  - mpp_fetch
provides_hooks: []
provides_middleware: []
