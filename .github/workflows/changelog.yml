name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Skip automated release PR
        if: ${{ startsWith(github.head_ref, 'changelog-release/') }}
        run: echo "Automated release PR already consumes changelog fragments"

      - name: Install changelogs
        if: ${{ !startsWith(github.head_ref, 'changelog-release/') }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/wevm/changelogs-rs/releases/download/changelogs%400.6.3/changelogs-linux-amd64" \
            -o "$HOME/.local/bin/changelogs"
          echo "d4168ee68b612224a26a39e86bfd2c923ac3dd2de12ee43d2bb65a5ea19df6b6  $HOME/.local/bin/changelogs" | sha256sum -c
          chmod +x "$HOME/.local/bin/changelogs"

      - name: Validate changelog
        if: ${{ !startsWith(github.head_ref, 'changelog-release/') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          RANGE="origin/${BASE_REF}...HEAD"
          CHANGED=$(git diff --name-only "$RANGE")
          RELEASABLE=$(printf '%s\n' "$CHANGED" | grep -vE '^(\.changelog/|\.github/|\.gitignore$|AGENTS\.md$|LICENSE$|README\.md$)' || true)
          FRAGMENTS=$(git diff --name-only --diff-filter=ACMR "$RANGE" -- '.changelog/*.md' | grep -v '^\.changelog/README\.md$' || true)

          if [ -n "$RELEASABLE" ] && [ -z "$FRAGMENTS" ]; then
            echo "::error title=Missing changelog::Add a .changelog/*.md fragment, or run 'changelogs add --empty' for an explicit no-release change."
            printf 'Releasable paths without a changelog fragment:\n%s\n' "$RELEASABLE"
            exit 1
          fi

          changelogs doctor --ecosystem python
