name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - if: matrix.python == '3.13'
        run: uv run ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build --no-sources
      - run: >-
          uvx --isolated --no-cache --from dist/*.whl python -c
          "import importlib.util;
          assert importlib.util.find_spec('hermes_cli') is None;
          import hermes_mpp.cli"
      - run: >-
          uvx --isolated --no-cache --from dist/*.whl
          --with hermes-agent==0.19.0 python -c
          "from importlib.metadata import entry_points;
          next(iter(entry_points(group='hermes_agent.plugins', name='mpp'))).load()"
      - run: uvx --isolated --no-cache --from dist/*.whl hermes-mpp --help

  hermes-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 0957277f2f468bac22bbfcfa7c43029858c9597e
          path: .hermes-agent
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip install -e ".hermes-agent[mcp]"
      - run: uv run --no-sync pytest

  httpx:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        httpx: ["0.27.0", "0.28.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip install "httpx==${{ matrix.httpx }}"
      - run: uv run --no-sync pytest
