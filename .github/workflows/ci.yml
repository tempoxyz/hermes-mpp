name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: CI Gate
    if: always()
    needs: [audit, test, httpx, package, install-smoke]
    runs-on: ubuntu-latest
    steps:
      - env:
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi

  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Export runtime requirements
        run: >-
          uv export --locked --no-dev --no-emit-project --no-hashes
          --output-file "$RUNNER_TEMP/requirements-runtime.txt"

      - name: Audit runtime requirements
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          -r "$RUNNER_TEMP/requirements-runtime.txt"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  httpx:
    name: HTTPX compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        httpx-version: ["0.27.0", "0.28.1"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install HTTPX ${{ matrix.httpx-version }}
        env:
          HTTPX_VERSION: ${{ matrix.httpx-version }}
        run: uv pip install "httpx==$HTTPX_VERSION"

      - name: Run tests
        run: uv run --no-sync pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build and validate package
        run: |
          uv build --no-sources
          uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: dist/*
          if-no-files-found: error

  install-smoke:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [base, hermes]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist
          path: dist

      - name: Create clean virtualenv
        run: uv venv .smoke-venv --python 3.12

      - name: Install built wheel
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)
          test -n "$wheel"
          install_targets=("$wheel")
          if [[ "$PROFILE" == "hermes" ]]; then
            install_targets+=("hermes-agent==0.19.0")
          fi
          uv pip install --python .smoke-venv/bin/python "${install_targets[@]}"

      - name: Smoke test built wheel (base)
        if: matrix.profile == 'base'
        run: |
          .smoke-venv/bin/python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("hermes_cli") is None
          import hermes_mpp.cli

          print("base install smoke test passed")
          PY
          .smoke-venv/bin/hermes-mpp --help

      - name: Smoke test built wheel (Hermes)
        if: matrix.profile == 'hermes'
        run: |
          .smoke-venv/bin/python - <<'PY'
          from importlib.metadata import entry_points

          plugin = next(iter(entry_points(group="hermes_agent.plugins", name="mpp"))).load()
          assert plugin.__name__ == "hermes_mpp"

          print("Hermes entry-point smoke test passed")
          PY
